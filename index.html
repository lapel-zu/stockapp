<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ストック管理</title>
<!-- ZXing removed: replaced with lightweight canvas EAN-13/JAN decoder -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bought:  #1a7fd4;
    --opened:  #e05c00;
    --bg:      #f5f3ee;
    --surface: #ffffff;
    --text:    #1a1a1a;
    --muted:   #666;
    --radius:  16px;
  }

  html, body {
    min-height: 100%;
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow-y: auto;
  }

  /* ── レイアウト ── */
  #app {
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 16px 32px;
    gap: 10px;
  }

  /* ── ヘッダー ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 {
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 0.05em;
    color: var(--text);
  }
  #history-btn {
    font-size: 14px;
    font-weight: 700;
    color: var(--muted);
    background: none;
    border: 2px solid #ccc;
    border-radius: 20px;
    padding: 6px 14px;
    cursor: pointer;
  }

  /* ── メインボタン ── */
  .action-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    flex-shrink: 0;
  }
  .action-btn {
    border: none;
    border-radius: var(--radius);
    padding: 18px 12px;
    font-family: inherit;
    font-size: 26px;
    font-weight: 900;
    color: #fff;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    transition: transform 0.1s, filter 0.1s;
    -webkit-tap-highlight-color: transparent;
    line-height: 1.2;
  }
  .action-btn:active { transform: scale(0.96); filter: brightness(0.9); }
  .action-btn .icon { font-size: 30px; }
  .action-btn.bought  { background: var(--bought); }
  .action-btn.opened  { background: var(--opened); }

  /* ── タブバー ── */
  .tab-bar {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    flex-shrink: 0;
  }
  .tab {
    padding: 10px;
    border-radius: 10px;
    border: 2px solid #d0ccc4;
    background: transparent;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
  }
  .tab.active {
    background: var(--text);
    border-color: var(--text);
    color: #fff;
  }

  /* ── タブビュー ── */
  .tab-view {
    display: none;
  }
  .tab-view.active {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  #stock-list, #shopping-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding-bottom: 8px;
    width: 100%;
  }

  /* ── ストック一覧 ── */
  #stock-section {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow-y: auto;
  }
  #stock-section h2 {
    font-size: 16px;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.08em;
    flex-shrink: 0;
  }
  #stock-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding-right: 2px;
    padding-bottom: 8px;
  }
  #stock-section::-webkit-scrollbar { width: 4px; }
  #stock-section::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }

  /* ── 買い物リスト ── */
  .shopping-empty {
    text-align: center;
    padding: 40px 20px;
    color: #aaa;
    font-size: 16px;
    line-height: 2;
  }
  .shopping-place {
    flex-shrink: 0;
  }
  .shopping-place-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.08em;
    padding: 4px 2px 6px;
  }
  .shopping-items {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 12px;
  }
  .shopping-item {
    background: var(--surface);
    border-radius: 12px;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-left: 5px solid #e74c3c;
  }
  .shopping-item.low {
    border-left-color: #f39c12;
  }
  .shopping-category {
    flex: 1;
    font-size: 20px;
    font-weight: 700;
  }
  .shopping-status {
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
  }
  .shopping-status.empty { color: #e74c3c; }
  .shopping-status.low   { color: #f39c12; }
  .shopping-item.cycle   { border-left-color: #888; }
  .shopping-status.cycle { color: #666; font-size: 12px; line-height: 1.6; text-align: right; }

  /* ── 場所グループ ── */
  .place-group {
    border: 2px solid #d8d4cc;
    border-radius: 14px;
    overflow: hidden;
    flex-shrink: 0;
  }
  .place-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    background: transparent;
    gap: 10px;
  }
  .place-title {
    font-size: 20px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .place-badges {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    justify-content: flex-end;
    flex: 1;
  }
  .place-badge-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
  }
  .place-chevron {
    font-size: 13px;
    color: #bbb;
    transition: transform 0.2s;
    flex-shrink: 0;
  }
  .place-group.open .place-chevron { transform: rotate(180deg); }
  .place-items {
    display: none;
    flex-direction: column;
    gap: 1px;
    border-top: 1px solid #e8e4dc;
  }
  .place-group.open .place-items { display: flex; }

  .stock-item {
    background: var(--surface);
    overflow: hidden;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .stock-item:last-child { border-radius: 0 0 10px 10px; }
  .stock-main {
    padding: 16px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .stock-dot {
    width: 16px; height: 16px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .dot-ok     { background: #2ecc71; }
  .dot-low    { background: #f39c12; }
  .dot-empty  { background: #e74c3c; }

  .stock-category {
    flex: 1;
    font-size: 18px;
    font-weight: 700;
    word-break: keep-all;
    overflow-wrap: break-word;
  }
  .stock-count {
    font-size: 20px;
    font-weight: 900;
    color: var(--text);
    white-space: nowrap;
    text-align: right;
  }
  .stock-count span {
    font-size: 14px;
    font-weight: 400;
    color: var(--muted);
  }
  .stock-date {
    font-size: 12px;
    color: var(--muted);
    font-weight: 400;
    margin-top: 2px;
  }
  .stock-chevron {
    font-size: 14px;
    color: #ccc;
    margin-left: 6px;
    transition: transform 0.2s;
  }
  .stock-item.open .stock-chevron { transform: rotate(180deg); }

  .stock-detail {
    display: none;
    padding: 0 18px 14px 46px;
    font-size: 14px;
    color: var(--muted);
    line-height: 1.6;
    border-top: 1px solid #f0f0f0;
    padding-top: 10px;
  }
  .stock-item.open .stock-detail { display: block; }

  /* ── オーバーレイ共通 ── */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.55);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .overlay.show {
    opacity: 1;
    pointer-events: all;
  }

  /* ── 確認ポップアップ ── */
  .confirm-sheet {
    background: var(--surface);
    border-radius: 24px 24px 0 0;
    width: 100%;
    max-width: 480px;
    padding: 32px 24px 40px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    transform: translateY(100%);
    transition: transform 0.25s cubic-bezier(0.34,1.2,0.64,1);
  }
  .overlay.show .confirm-sheet {
    transform: translateY(0);
  }

  .confirm-message {
    font-size: 30px;
    font-weight: 700;
    line-height: 1.4;
    text-align: center;
  }
  .confirm-message b {
    display: block;
    font-size: 34px;
    font-weight: 900;
  }

  .qty-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
  }
  .qty-label { font-size: 20px; font-weight: 700; color: var(--muted); }
  .qty-btn {
    width: 56px; height: 56px;
    border-radius: 50%;
    border: 3px solid #ddd;
    background: var(--bg);
    font-size: 28px;
    font-weight: 900;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.1s;
  }
  .qty-btn:active { background: #e0e0e0; }
  #qty-display {
    font-size: 40px;
    font-weight: 900;
    min-width: 60px;
    text-align: center;
  }

  .confirm-actions {
    display: grid;
    grid-template-columns: 1fr 2fr;
    gap: 12px;
  }
  .btn-cancel {
    padding: 18px;
    border-radius: 12px;
    border: 3px solid #ddd;
    background: var(--bg);
    font-family: inherit;
    font-size: 20px;
    font-weight: 700;
    cursor: pointer;
    color: var(--muted);
  }
  .btn-ok {
    padding: 18px;
    border-radius: 12px;
    border: none;
    font-family: inherit;
    font-size: 24px;
    font-weight: 900;
    color: #fff;
    cursor: pointer;
    transition: filter 0.1s;
  }
  .btn-ok:active { filter: brightness(0.9); }
  .btn-ok.bought { background: var(--bought); }
  .btn-ok.opened { background: var(--opened); }

  /* ── 履歴シート ── */
  .history-sheet {
    background: var(--surface);
    border-radius: 24px 24px 0 0;
    width: 100%;
    max-width: 480px;
    padding: 28px 20px 40px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-height: 80dvh;
    transform: translateY(100%);
    transition: transform 0.25s cubic-bezier(0.34,1.2,0.64,1);
  }
  .overlay.show .history-sheet {
    transform: translateY(0);
  }
  .history-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .history-header h2 { font-size: 22px; font-weight: 900; }
  .close-btn {
    font-size: 16px; font-weight: 700; color: var(--muted);
    background: none; border: none; cursor: pointer; padding: 4px 8px;
  }
  .history-list { overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
  .history-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 4px;
    border-bottom: 1px solid #eee;
  }
  .event-badge {
    font-size: 12px; font-weight: 700;
    padding: 4px 10px; border-radius: 20px; color: #fff; white-space: nowrap;
  }
  .badge-bought  { background: var(--bought); }
  .badge-opened  { background: var(--opened); }
  .history-text { flex: 1; }
  .history-category { font-size: 18px; font-weight: 700; }
  .history-product  { font-size: 12px; color: var(--muted); }
  .history-date { font-size: 12px; color: var(--muted); white-space: nowrap; }

  /* 修正ボタン */
  .delete-btn {
    font-size: 12px; color: #e74c3c;
    background: none; border: 1px solid #e74c3c;
    border-radius: 6px; padding: 3px 8px; cursor: pointer;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>📦 ストック管理</h1>
    <button id="history-btn" onclick="openHistory()">履歴・修正</button>
  </header>

  <!-- タブ切り替え -->
  <div class="tab-bar">
    <button class="tab active" id="tab-stock" onclick="switchTab('stock')">いまのストック</button>
    <button class="tab" id="tab-shopping" onclick="switchTab('shopping')">🛒 買い物リスト</button>
  </div>

  <div class="action-buttons">
    <button class="action-btn bought" onclick="handleScan('bought')">
      <span class="icon">🛒</span>買った
    </button>
    <button class="action-btn opened" onclick="handleScan('opened')">
      <span class="icon">
        <svg width="44" height="44" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="5" y="2" width="34" height="9" rx="2" fill="rgba(255,255,255,0.55)" stroke="rgba(255,255,255,0.9)" stroke-width="1.5"/>
          <rect x="3" y="16" width="38" height="26" rx="3" fill="rgba(255,255,255,0.3)" stroke="rgba(255,255,255,0.9)" stroke-width="2"/>
          <line x1="3" y1="26" x2="41" y2="26" stroke="rgba(255,255,255,0.5)" stroke-width="1.2"/>
          <rect x="15" y="29" width="14" height="9" rx="2" fill="rgba(255,255,255,0.45)"/>
        </svg>
      </span>使い始めた
    </button>
  </div>

  <!-- ストック一覧 -->
  <section id="view-stock" class="tab-view active">
    <div id="stock-list"></div>
  </section>

  <!-- 買い物リスト（BS右側：補充が必要なもの） -->
  <section id="view-shopping" class="tab-view">
    <div id="shopping-list"></div>
  </section>
</div>

<!-- 「使い始めた」分岐シート -->
<div class="overlay" id="opened-select-overlay" onclick="overlayClickClose(event,'opened-select-overlay')">
  <div class="confirm-sheet">
    <div class="confirm-message"><b>使い始めた</b><span style="font-size:20px;color:#666">どちらから登録しますか？</span></div>
    <div class="confirm-actions" style="grid-template-columns:1fr 1fr">
      <button class="btn-ok opened" onclick="openFromStock()">在庫から選ぶ</button>
      <button class="btn-ok" style="background:#555" onclick="openFromBarcode()">バーコード</button>
    </div>
    <button class="btn-cancel" style="text-align:center;width:100%" onclick="closeOpenedSelect()">キャンセル</button>
  </div>
</div>

<!-- 在庫選択シート -->
<div class="overlay" id="stock-select-overlay" onclick="overlayClickClose(event,'stock-select-overlay')">
  <div class="history-sheet" style="max-height:75dvh">
    <div class="history-header">
      <h2>在庫から選ぶ</h2>
      <button class="close-btn" onclick="closeStockSelect()">閉じる</button>
    </div>
    <div class="history-list" id="stock-select-list" style="overflow-y:auto;gap:6px"></div>
  </div>
</div>
<!-- getUserMedia ライブスキャン -->
<div id="camera-overlay" style="display:none;position:fixed;inset:0;z-index:200;background:#000;flex-direction:column;align-items:center;justify-content:flex-end">
  <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">
    <video id="scan-video" autoplay playsinline muted
      style="width:100%;height:100%;object-fit:cover"></video>
    <!-- 照準枠 -->
    <div style="position:absolute;width:72%;max-width:320px;height:120px;border:3px solid #fff;border-radius:12px;box-shadow:0 0 0 9999px rgba(0,0,0,0.45)">
      <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:13px;white-space:nowrap;opacity:0.85">バーコードをここに合わせてください</div>
    </div>
  </div>
  <div style="position:relative;z-index:1;width:100%;max-width:480px;padding:20px 24px 40px;display:flex;flex-direction:column;gap:12px">
    <div id="scan-status" style="color:#fff;font-size:17px;font-weight:700;text-align:center;text-shadow:0 1px 4px rgba(0,0,0,0.8)">読み取り中…</div>
    <button onclick="stopScan()" style="width:100%;padding:16px;border-radius:14px;border:2px solid rgba(255,255,255,0.4);background:rgba(0,0,0,0.5);color:#fff;font-size:18px;font-weight:700;cursor:pointer;font-family:inherit">キャンセル</button>
    <button onclick="fallbackManual()" style="width:100%;padding:12px;border-radius:14px;border:none;background:rgba(255,255,255,0.15);color:#fff;font-size:15px;cursor:pointer;font-family:inherit">手入力で登録する</button>
  </div>
</div>

<!-- 手入力フォールバック -->
<div class="overlay" id="manual-overlay">
  <div class="confirm-sheet">
    <div class="confirm-message"><b>商品を手入力</b></div>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div>
        <div style="font-size:14px;color:#888;margin-bottom:6px;font-weight:700">商品名</div>
        <input id="manual-name" type="text" placeholder="例：メリット シャンプー 詰替"
          style="width:100%;padding:14px;border-radius:10px;border:2px solid #ddd;font-size:16px;font-family:inherit">
      </div>
      <div>
        <div style="font-size:14px;color:#888;margin-bottom:6px;font-weight:700">カテゴリ</div>
        <select id="manual-category"
          style="width:100%;padding:14px;border-radius:10px;border:2px solid #ddd;font-size:16px;font-family:inherit;background:#fff">
        </select>
      </div>
      <div>
        <div style="font-size:14px;color:#888;margin-bottom:6px;font-weight:700">場所</div>
        <select id="manual-place"
          style="width:100%;padding:14px;border-radius:10px;border:2px solid #ddd;font-size:16px;font-family:inherit;background:#fff">
          <option>トイレ</option><option>お風呂</option><option>洗面台</option><option>キッチン</option><option>リビング</option><option>その他</option>
        </select>
      </div>
    </div>
    <div class="confirm-actions">
      <button class="btn-cancel" onclick="closeManualInput()">キャンセル</button>
      <button class="btn-ok bought" id="manual-ok-btn" onclick="confirmManualInput()">OK</button>
    </div>
  </div>
</div>

<div class="overlay" id="confirm-overlay" onclick="overlayClickClose(event,'confirm-overlay')">
  <div class="confirm-sheet">
    <div class="confirm-message" id="confirm-msg"></div>
    <div class="qty-row" id="qty-row">
      <div class="qty-label">個数</div>
      <button class="qty-btn" onclick="changeQty(-1)">－</button>
      <div id="qty-display">1</div>
      <button class="qty-btn" onclick="changeQty(1)">＋</button>
    </div>
    <div class="confirm-actions">
      <button class="btn-cancel" onclick="closeConfirm()">キャンセル</button>
      <button class="btn-ok" id="btn-ok" onclick="confirmAction()">OK</button>
    </div>
  </div>
</div>

<!-- 汎用アラートポップアップ -->
<div class="overlay" id="alert-overlay">
  <div class="confirm-sheet">
    <div class="confirm-message" id="alert-msg"></div>
    <div class="confirm-actions" id="alert-actions" style="grid-template-columns:1fr">
      <button class="btn-ok bought" id="alert-ok-btn" onclick="closeAlert()">OK</button>
    </div>
  </div>
</div>

<!-- 履歴シート -->
<div class="overlay" id="history-overlay" onclick="overlayClickClose(event,'history-overlay')">
  <div class="history-sheet">
    <div class="history-header">
      <h2>履歴・修正</h2>
      <button class="close-btn" onclick="closeHistory()">閉じる</button>
    </div>
    <div class="history-list" id="history-list"></div>
  </div>
</div>

<script>
const DUMMY_PRODUCTS = [
  { barcode:'4901301645531', name:'メリット シャンプー 詰替400ml',    category:'シャンプー',         place:'お風呂',  unit:'本' },
  { barcode:'4902430531474', name:'エリエール トイレットペーパー12R', category:'トイレットペーパー', place:'トイレ',  unit:'パック' },
  { barcode:'4901301352026', name:'ビオレu 泡ハンドソープ 詰替250ml', category:'石鹸・ソープ',       place:'洗面台',  unit:'本' },
  { barcode:'4902430709996', name:'エリエール ティッシュ 5箱パック',  category:'ティッシュ',         place:'リビング',unit:'パック' },
  { barcode:'4987035040829', name:'花王 アタック 洗濯洗剤 800g',      category:'洗濯洗剤',           place:'洗面台',  unit:'個' },
];

// カテゴリ→単位の辞書（バーコードAPI取得後の紐づけ用）
const CATEGORY_UNITS = {
  'シャンプー':         '本',
  'リンス':             '本',
  'トイレットペーパー': 'パック',
  'ティッシュ':         'パック',
  'キッチンペーパー':   'パック',
  '石鹸・ソープ':       '本',
  '洗濯洗剤':           '個',
  '食器洗剤':           '本',
  '歯磨き粉':           '本',
  'ボディソープ':       '本',
  'おむつ':             'パック',
  '消臭剤':             '個',
  '掃除用洗剤':         '本',
  'ラップ・袋':         '本',
  'スポンジ・たわし':   '個',
  'その他キッチン':     '個',
};

function getUnit(category) {
  return CATEGORY_UNITS[category] || '個';
}

const PLACES = [
  { key:'トイレ',     icon:'🚽' },
  { key:'お風呂',     icon:'🛁' },
  { key:'洗面台',     icon:'🪥' },
  { key:'キッチン',   icon:'🍳' },
  { key:'リビング',   icon:'🛋️' },
  { key:'その他',     icon:'📦' },
];

let events  = JSON.parse(localStorage.getItem('stockEvents') || '[]');
let pending = null;
let qty     = 1;

// ── ストレージ管理 ──
const EVENTS_MAX = 500;      // 保持する最大イベント件数
const CACHE_MAX  = 200;      // バーコードキャッシュ最大件数

// eventsを保存。QuotaExceeded時は古いデータをトリミングして再試行
function saveEvents() {
  // 念のため上限を超えていたら古い順に削る
  if (events.length > EVENTS_MAX) {
    events = events.slice(0, EVENTS_MAX);
  }
  _trySaveEvents(events);
}

function _trySaveEvents(data) {
  try {
    localStorage.setItem('stockEvents', JSON.stringify(data));
  } catch(e) {
    if (e.name === 'QuotaExceededError' || e.code === 22) {
      // 容量超過 → 古い50件を削って再試行（最大3回）
      if (data.length > 50) {
        const trimmed = data.slice(0, data.length - 50);
        events = trimmed;
        _trySaveEvents(trimmed);
      } else {
        // これ以上削れない場合はバーコードキャッシュを消してから再試行
        try {
          localStorage.removeItem('barcodeCache');
          localStorage.setItem('stockEvents', JSON.stringify(data));
        } catch(e2) {
          console.error('localStorage保存失敗:', e2);
        }
      }
    }
  }
}

// バーコードキャッシュ：件数上限付き
function getBarcodeCache() {
  try {
    return JSON.parse(localStorage.getItem('barcodeCache') || '{}');
  } catch { return {}; }
}
function setBarcodeCache(barcode, product) {
  if (!barcode) return;
  try {
    const cache = getBarcodeCache();
    cache[barcode] = product;
    // 上限を超えたら古いキーを削除
    const keys = Object.keys(cache);
    if (keys.length > CACHE_MAX) {
      // 先頭から古いものを削る（挿入順）
      const excess = keys.slice(0, keys.length - CACHE_MAX);
      for (const k of excess) delete cache[k];
    }
    localStorage.setItem('barcodeCache', JSON.stringify(cache));
  } catch(e) {
    // キャッシュ保存失敗は無視（必須ではない）
    console.warn('barcodeCache保存失敗:', e.message);
  }
}
function handleScan(eventType) {
  if (eventType === 'opened') {
    document.getElementById('opened-select-overlay').classList.add('show');
    return;

  startScan('bought');
}

}

}

}

function renderStockSelect() {
  const list  = document.getElementById('stock-select-list');
  const stock = calcStock().filter(s => s.count > 0);

  if (stock.length === 0) {
    list.innerHTML = '<p style="color:#aaa;text-align:center;padding:24px">在庫がありません</p>';
    return;
  }

  const usedPlaces = PLACES.filter(p => stock.some(s => s.place === p.key));
  list.innerHTML = usedPlaces.map(p => {
    const items = stock.filter(s => s.place === p.key);
    const rows = items.map(s => {
      const unit = getUnit(s.category);
      return `<div onclick="selectStockItem('${s.category}','${s.place}')"
        style="background:#fff;border-radius:10px;padding:14px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;margin-bottom:4px;border-left:4px solid var(--opened)">
        <div style="flex:1;font-size:18px;font-weight:700">${s.category}</div>
        <div style="font-size:15px;color:#888;white-space:nowrap">あと ${s.count} ${unit}</div>
      </div>`;
    }).join('');
    return `<div style="margin-bottom:10px">
      <div style="font-size:13px;font-weight:700;color:#888;padding:2px 4px 6px">${p.icon} ${p.key}</div>
      ${rows}
    </div>`;
  }).join('');
}

function selectStockItem(category, place) {
  closeStockSelect();
  const last = events.find(e => e.category === category && (e.place||'その他').trim() === place.trim());
  const product = { name: last ? last.name : category, category, place, unit: getUnit(category) };
  pending = { product, eventType: 'opened' };
  openConfirmSheet(product, 'opened');
}

// eventsから同じバーコードの登録を探してキャッシュ補完（手動登録済み商品の再利用）
function lookupFromEvents(barcode) {
  if (!barcode) return null;
  // 直近の登録を優先
  const match = events.find(e => e.barcode === barcode);
  if (!match) return null;
  return {
    barcode,
    name:     match.name,
    category: match.category,
    place:    match.place || 'その他',
    unit:     getUnit(match.category),
  };
}

// ── Open Food Facts APIで商品名取得 ──
// ヒット率改善: JP→world の順でフォールバック、ステータス表示付き
async function fetchProductByBarcode(barcode) {
  if (!barcode) return null;

  // 1. キャッシュ確認
  const cache = getBarcodeCache();
  if (cache[barcode]) {
    console.log('[lookup] キャッシュヒット:', barcode);
    return cache[barcode];
  }

  // 2. events配列から過去の登録を検索（手動入力で登録済みの商品を再利用）
  const fromEvents = lookupFromEvents(barcode);
  if (fromEvents) {
    console.log('[lookup] eventsヒット:', barcode, fromEvents.name);
    setBarcodeCache(barcode, fromEvents); // 次回からキャッシュで返す
    return fromEvents;
  }

  // スキャン中表示を更新
  const statusEl = document.getElementById('scan-status');
  if (statusEl) statusEl.textContent = '商品情報を取得中…';

  // 2. Open Food Facts（日本DBを優先、次にworldにフォールバック）
  const endpoints = [
    `https://jp.openfoodfacts.org/api/v0/product/${barcode}.json`,
    `https://world.openfoodfacts.org/api/v0/product/${barcode}.json`,
  ];

  for (const url of endpoints) {
    try {
      const res  = await fetch(url, { signal: AbortSignal.timeout(3000) });
      if (!res.ok) continue;
      const data = await res.json();
      if (data.status === 1 && data.product) {
        // 商品名: 日本語優先 → 英語 → ブランド+カテゴリ名
        const name =
          data.product.product_name_ja ||
          data.product.product_name ||
          data.product.abbreviated_product_name ||
          (data.product.brands ? `${data.product.brands}` : '') ||
          '';
        if (name) {
          const category = matchCategory(name);
          const product  = { barcode, name, category, place: guessPlace(category), unit: getUnit(category) };
          setBarcodeCache(barcode, product);
          console.log('[API] ヒット:', url, name);
          return product;
        }
      }
      console.log('[API] status!=1 or no product_name:', url, data.status);
    } catch(e) {
      console.log('[API] エラー:', url, e.message);
    }
  }

  console.log('[API] 全エンドポイントミス → 手入力へ');
  return null;
}

// ── 軽量EAN-13 / JAN-13 デコーダー（ZXing不要・Canvas方式） ──
// バグ修正v2:
//   - 適応的閾値（Otsu法）で照明むらに対応
//   - ユニット幅をスタートガード+右半部全体から再推定して精度向上
//   - 複数行の多数決でデコード結果を確定（誤読防止）

const EAN13 = (() => {
  const L = ['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'];
  const G = ['0100111','0110011','0011011','0100001','0011101','0111001','0000101','0010001','0001001','0010111'];
  const R = ['1110010','1100110','1101100','1000010','1011100','1001110','1010000','1000100','1001000','1110100'];
  const FIRST = ['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];

  // Otsu法による適応的二値化閾値算出
  function otsuThreshold(gray) {
    const hist = new Int32Array(256);
    for (const v of gray) hist[v]++;
    const total = gray.length;
    let sum = 0;
    for (let i = 0; i < 256; i++) sum += i * hist[i];
    let sumB = 0, wB = 0, max = 0, thr = 128;
    for (let t = 0; t < 256; t++) {
      wB += hist[t];
      if (!wB) continue;
      const wF = total - wB;
      if (!wF) break;
      sumB += t * hist[t];
      const mB = sumB / wB;
      const mF = (sum - sumB) / wF;
      const between = wB * wF * (mB - mF) * (mB - mF);
      if (between > max) { max = between; thr = t; }
    }
    return thr;
  }

  function decode(gray, width) {
    const thr = otsuThreshold(gray);

    // 二値化（バー=1, スペース=0）
    const bits = new Uint8Array(width);
    for (let x = 0; x < width; x++) bits[x] = gray[x] <= thr ? 1 : 0;

    // ラン長エンコード
    const runs = [];
    let cur = bits[0], cnt = 1;
    for (let x = 1; x < width; x++) {
      if (bits[x] === cur) { cnt++; }
      else { runs.push([cur, cnt]); cur = bits[x]; cnt = 1; }
    }
    runs.push([cur, cnt]);

    // スタートガード(bar-space-bar = 1-0-1)を探す
    for (let i = 0; i < runs.length - 58; i++) {
      if (runs[i][0] !== 1) continue;

      // スタートガード3本からユニット幅の初期推定
      const uGuard = (runs[i][1] + runs[i+1][1] + runs[i+2][1]) / 3;
      if (uGuard < 1) continue;

      // runs → 7ビット変換（ユニット幅 u を使用）
      function runGroupTo7bit(start, u) {
        let s = '';
        for (let j = 0; j < 4; j++) {
          if (start + j >= runs.length) return null;
          const [color, w] = runs[start + j];
          const q = Math.max(1, Math.round(w / u));
          if (q > 4) return null;
          s += (color ? '1' : '0').repeat(q);
        }
        // 7ビット厳密チェック
        return s.length === 7 ? s : null;
      }

      // ── 左6桁デコード（L/G判別でパリティも取得）──
      let leftDigits = [], parity = '', pos = i + 3;
      let valid = true;

      for (let d = 0; d < 6; d++) {
        // ユニット幅を都度再推定（左側runs全体の平均でドリフト補正）
        let uLocal = uGuard;
        if (d > 0) {
          let totalW = 0, totalRuns = 0;
          for (let j = i; j < pos; j++) { totalW += runs[j][1]; totalRuns++; }
          // EAN左半=スタートガード3runs + 6桁×4runs = 27runs, 理論幅 = 3 + 6×7 = 45units
          const theoryUnits = 3 + d * 7;
          const actualRuns  = 3 + d * 4;
          let sumW = 0;
          for (let j = i; j < i + actualRuns && j < runs.length; j++) sumW += runs[j][1];
          uLocal = sumW / theoryUnits;
          if (uLocal < 0.5) uLocal = uGuard;
        }

        const b = runGroupTo7bit(pos, uLocal);
        if (!b) { valid = false; break; }
        const li = L.indexOf(b);
        if (li !== -1) { leftDigits.push(li); parity += 'L'; }
        else {
          const gi = G.indexOf(b);
          if (gi !== -1) { leftDigits.push(gi); parity += 'G'; }
          else { valid = false; break; }
        }
        pos += 4;
      }
      if (!valid || leftDigits.length !== 6) continue;

      const firstDigit = FIRST.indexOf(parity);
      if (firstDigit === -1) continue;

      // ── 中間ガード(5runs = 01010)確認 ──
      let midStr = '';
      for (let j = 0; j < 5; j++) {
        if (pos + j >= runs.length) { valid = false; break; }
        midStr += runs[pos + j][0] ? '1' : '0';
      }
      if (!valid || midStr !== '01010') continue;
      pos += 5;

      // ── 右6桁（R符号、ユニット幅を右半部から再推定）──
      // 右半部理論幅: 6桁×7units + 終端ガード3units = 45units
      // 実際のruns: 右6桁×4runs + 3runs = 27runs
      let rightSumW = 0;
      const rightRunCount = Math.min(27, runs.length - pos);
      for (let j = 0; j < rightRunCount; j++) rightSumW += runs[pos + j][1];
      const uRight = rightRunCount >= 27 ? rightSumW / 45 : uGuard;

      let rightDigits = [];
      for (let d = 0; d < 6; d++) {
        const b = runGroupTo7bit(pos, uRight);
        if (!b) { valid = false; break; }
        const ri = R.indexOf(b);
        if (ri === -1) { valid = false; break; }
        rightDigits.push(ri);
        pos += 4;
      }
      if (!valid || rightDigits.length !== 6) continue;

      const allDigits = [firstDigit, ...leftDigits, ...rightDigits];

      // ── チェックデジット検証 ──
      let sum = 0;
      for (let k = 0; k < 12; k++) sum += allDigits[k] * (k % 2 === 0 ? 1 : 3);
      if ((10 - (sum % 10)) % 10 !== allDigits[12]) continue;

      return allDigits.join('');
    }
    return null;
  }

  // VideoFrameをCanvas経由でデコード（getUserMedia用）
  // ctx: CanvasRenderingContext2D, w/h: canvas サイズ
  function decodeFrame(ctx, w, h) {
    // 照準枠の中央30%の横帯のみ走査（速度とノイズ耐性のトレードオフ）
    const scanRows = [0.5, 0.47, 0.53, 0.44, 0.56].map(r => Math.round(h * r));
    for (const row of scanRows) {
      if (row < 0 || row >= h) continue;
      const d = ctx.getImageData(0, row, w, 1).data;
      const gray = new Uint8Array(w);
      for (let x = 0; x < w; x++) {
        gray[x] = (d[x*4]*77 + d[x*4+1]*150 + d[x*4+2]*29) >> 8;
      }
      const r = decode(gray, w);
      if (r) return r;
    }
    return null;
  }

  return { decodeFrame };
})();

// ── getUserMedia ライブスキャン ──
let scanEventType = 'bought';
let isScanning    = false;
let _stream       = null;
let _rafId        = null;
let _scanCanvas   = null;
let _scanCtx      = null;

function startScan(eventType) {
  if (isScanning) return;
  scanEventType = eventType;

  // file:// では getUserMedia が使えないので input[capture] にフォールバック
  if (location.protocol === 'file:') {
    _startCaptureFallback();
    return;
  }
  _openCamera().catch(e => {
    console.log('カメラ起動失敗:', e.message);
    stopScan();
    showManualInput('', scanEventType);
  });
}

// ── file:// 用フォールバック（input[capture]方式）──
function _startCaptureFallback() {
  let input = document.getElementById('_capture-input');
  if (!input) {
    input = document.createElement('input');
    input.type = 'file';
    input.id   = '_capture-input';
    input.accept = 'image/*';
    input.setAttribute('capture', 'environment');
    input.style.display = 'none';
    document.body.appendChild(input);
  }
  // 毎回新しいリスナーをセットするためcloneで置き換え
  const fresh = input.cloneNode(false);
  input.parentNode.replaceChild(fresh, input);
  fresh.addEventListener('change', async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    document.getElementById('scan-status').textContent = '読み取り中…';
    document.getElementById('camera-overlay').style.display = 'flex';
    isScanning = true;
    try {
      const barcode = await _decodeImageFile(file);
      if (barcode) {
        document.getElementById('scan-status').textContent = '商品情報を確認中…';
        await handleBarcodeResult(barcode, scanEventType);
      } else {
        stopScan();
        showManualInput('', scanEventType);
      }
    } catch(err) {
      stopScan();
      showManualInput('', scanEventType);
    }
  });
  fresh.click();
}

// file:// フォールバック用の静止画デコード
async function _decodeImageFile(file) {
  return new Promise(resolve => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const MAX = 800;
      let w = img.naturalWidth, h = img.naturalHeight;
      if (Math.max(w,h) > MAX) { const s = MAX/Math.max(w,h); w=Math.round(w*s); h=Math.round(h*s); }
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      const ctx = cv.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(img, 0, 0, w, h);
      img.src = '';
      const result = EAN13.decodeFrame(ctx, w, h);
      cv.width = 1;
      resolve(result);
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
    img.src = url;
  });
}

async function _openCamera() {
  isScanning = true;
  document.getElementById('scan-status').textContent = 'カメラを起動中…';
  document.getElementById('camera-overlay').style.display = 'flex';

  _stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
    audio: false,
  });

  const video = document.getElementById('scan-video');
  video.srcObject = _stream;
  await video.play();

  const vw = video.videoWidth  || 1280;
  const vh = video.videoHeight || 720;
  _scanCanvas = document.createElement('canvas');
  _scanCanvas.width  = vw;
  _scanCanvas.height = vh;
  _scanCtx = _scanCanvas.getContext('2d', { willReadFrequently: true });

  document.getElementById('scan-status').textContent = 'バーコードを枠に合わせてください';
  _rafId = requestAnimationFrame(() => _scanLoop(video));
}

function _scanLoop(video) {
  // stopScan済みなら即終了（nullチェック）
  if (!isScanning || !_scanCtx || !_scanCanvas) return;

  _scanCtx.drawImage(video, 0, 0, _scanCanvas.width, _scanCanvas.height);
  const barcode = EAN13.decodeFrame(_scanCtx, _scanCanvas.width, _scanCanvas.height);

  if (barcode) {
    console.log('スキャン成功:', barcode);
    // 先にループを止めてからAPI呼び出し
    cancelAnimationFrame(_rafId); _rafId = null;
    if (_stream) { _stream.getTracks().forEach(t => t.stop()); _stream = null; }
    const video2 = document.getElementById('scan-video');
    if (video2) video2.srcObject = null;
    _scanCanvas = null; _scanCtx = null;
    isScanning = false;

    document.getElementById('scan-status').textContent = '商品情報を確認中…';
    handleBarcodeResult(barcode, scanEventType);
    return;
  }

  _rafId = requestAnimationFrame(() => _scanLoop(video));
}

function fallbackManual() {
  stopScan();
  showManualInput('', scanEventType);
}

function stopScan() {
  isScanning = false;
  if (_rafId) { cancelAnimationFrame(_rafId); _rafId = null; }
  if (_stream) { _stream.getTracks().forEach(t => t.stop()); _stream = null; }
  const video = document.getElementById('scan-video');
  if (video) video.srcObject = null;
  _scanCanvas = null;
  _scanCtx    = null;
  document.getElementById('camera-overlay').style.display = 'none';
}

async function handleBarcodeResult(barcode, eventType) {
  const product = await fetchProductByBarcode(barcode);
  document.getElementById('camera-overlay').style.display = 'none';

  if (product) {
    pending = { product, eventType };
    qty = 1;
    if (eventType === 'opened' && getStockCount(product.category, product.place) === 0) {
      showAlert('🤔', product.category,
        `登録されているストックがありません。\n登録を忘れていた場合はそのまま進めてください。`,
        [
          { label: 'キャンセル', style: 'btn-cancel', fn: 'closeAlert()' },
          { label: 'そのまま登録', style: 'btn-ok opened', fn: 'closeAlertAndConfirm()' }
        ]
      );
    } else {
      openConfirmSheet(product, eventType);
    }
  } else {
    showManualInput(barcode, eventType);
  }
}

function openConfirmSheet(product, eventType) {
  qty = 1; // 必ず数値でリセット
  const unit  = product.unit || getUnit(product.category);
  const label = eventType === 'bought' ? `を追加しますか？` : `を使い始めますか？`;
  document.getElementById('confirm-msg').innerHTML =
    `<b>${product.category}</b>${label}<br><span style="font-size:18px;color:#666">${product.name}</span>`;
  document.getElementById('btn-ok').className = `btn-ok ${eventType}`;
  document.getElementById('qty-display').textContent = qty; // 変数から（文字列リテラル'1'を使わない）
  document.getElementById('qty-row').style.display = eventType === 'bought' ? 'flex' : 'none';
  document.getElementById('confirm-overlay').classList.add('show');
}

function closeAlertAndConfirm() {
  closeAlert();
  if (pending) setTimeout(() => openConfirmSheet(pending.product, pending.eventType), 250);
}

function changeQty(delta) {
  qty = Math.max(1, (qty | 0) + (delta | 0)); // |0 で整数に強制（文字列混入対策）
  document.getElementById('qty-display').textContent = qty;
}

function closeConfirm() {
  document.getElementById('confirm-overlay').classList.remove('show');
  pending = null;
}

function confirmAction() {
  if (!pending) return;
  const { product, eventType } = pending;
  const count = eventType === 'bought' ? (qty | 0) : 1; // |0 で整数保証
  for (let i = 0; i < count; i++) {
    events.unshift({
      id: Date.now() + i,
      barcode:   product.barcode,
      name:      product.name,
      category:  product.category,
      place:     product.place || 'その他',
      eventType,
      date: new Date().toISOString()
    });
  }
  saveEvents();
  closeConfirm();
  renderStock();
  if (eventType === 'opened') setTimeout(() => checkCycleAlert(product.category, product.place), 300);
}

function calcAvgCycleDays(category, place) {
  const p = place || 'その他';
  const dates = events
    .filter(e => e.category === category && (e.place||'その他') === p && e.eventType === 'opened')
    .map(e => new Date(e.date).getTime())
    .sort((a, b) => a - b);
  if (dates.length < 2) return null;
  const gaps = [];
  for (let i = 1; i < dates.length; i++)
    gaps.push((dates[i] - dates[i-1]) / 86400000);
  return gaps.reduce((a, b) => a + b, 0) / gaps.length;
}

function daysSinceLastOpened(category, place) {
  const p = place || 'その他';
  const last = events
    .filter(e => e.category === category && (e.place||'その他') === p && e.eventType === 'opened')
    .map(e => new Date(e.date).getTime())
    .sort((a, b) => b - a)[0];
  return last ? (Date.now() - last) / 86400000 : null;
}

function getStockCount(category, place) {
  const p = place || 'その他';
  const b = events.filter(e => e.category === category && (e.place||'その他') === p && e.eventType === 'bought').length;
  const o = events.filter(e => e.category === category && (e.place||'その他') === p && e.eventType === 'opened').length;
  return Math.max(0, b - o);
}

function checkCycleAlert(category, place) {
  const avg = calcAvgCycleDays(category, place);
  if (!avg) return;
  const stock = getStockCount(category, place);
  const daysLeft = avg * stock;
  if (daysLeft <= avg * 1.2) {
    const weeks = Math.round(daysLeft / 7);
    showAlert('⚠️', category,
      `もうすぐなくなるかも？\n約${weeks > 0 ? weeks + '週間後' : 'まもなく'}が目安です。\n買い物のときに確認してみてください。`);
  }
}

// place単位でサイクル外れを返す
function getInactiveItems() {
  const stock = calcStock();
  return stock.filter(s => {
    const avg  = calcAvgCycleDays(s.category, s.place);
    const days = daysSinceLastOpened(s.category, s.place);
    return avg && days && days > avg + 30;
  });
}

function showAlert(icon, title, body, buttons) {
  document.getElementById('alert-msg').innerHTML =
    `<span style="font-size:40px">${icon}</span><b>${title}</b><span style="font-size:20px;white-space:pre-line;color:#444">${body}</span>`;

  const actions = document.getElementById('alert-actions');
  if (buttons && buttons.length > 0) {
    actions.style.gridTemplateColumns = buttons.map(() => '1fr').join(' ');
    actions.innerHTML = buttons.map(b =>
      `<button class="${b.style}" onclick="${b.fn}">${b.label}</button>`
    ).join('');
  } else {
    actions.style.gridTemplateColumns = '1fr';
    actions.innerHTML = `<button class="btn-ok bought" onclick="closeAlert()">OK</button>`;
  }
  document.getElementById('alert-overlay').classList.add('show');
}

function closeAlert() {
  document.getElementById('alert-overlay').classList.remove('show');
}

function calcStock() {
  const map = {};
  for (const e of events) {
    const place = (e.place || 'その他').trim();
    const key = `${place}__${e.category}`;
    if (!map[key]) map[key] = { category: e.category, place, name: e.name, bought: 0, opened: 0, lastBought: null };
    if (e.eventType === 'bought') {
      map[key].bought += 1;
      if (!map[key].lastBought || e.date > map[key].lastBought) map[key].lastBought = e.date;
    }
    if (e.eventType === 'opened') map[key].opened += 1;
  }
  return Object.values(map).map(v => ({ ...v, count: v.bought - v.opened }));
}

function renderStock() {
  const list  = document.getElementById('stock-list');
  const stock = calcStock();
  if (stock.length === 0) {
    list.innerHTML = '<p style="color:#aaa;font-size:16px;text-align:center;padding:24px 0">まだ登録がありません</p>';
    return;
  }

  // 登録済みの場所だけ表示（PLACESの順序を維持）
  const usedPlaces = PLACES.filter(p => stock.some(s => s.place === p.key));

  list.innerHTML = usedPlaces.map(p => {
    const items = stock.filter(s => s.place === p.key);
    // 場所ヘッダーのドット（在庫状態サマリ）
    const dots = items.map(s => {
      const cls = s.count <= 0 ? 'dot-empty' : s.count === 1 ? 'dot-low' : 'dot-ok';
      return `<div class="place-badge-dot ${cls}"></div>`;
    }).join('');

    const itemsHtml = items.map(s => {
      const dotClass = s.count <= 0 ? 'dot-empty' : s.count === 1 ? 'dot-low' : 'dot-ok';
      const countNum = Math.max(0, s.count);
      const unit     = getUnit(s.category);
      const names    = [...new Set(events.filter(e => e.category === s.category && (e.place||'その他') === s.place).map(e => e.name))].join('、');
      const dateStr  = s.lastBought
        ? (() => { const d = new Date(s.lastBought); return `購入 ${d.getMonth()+1}/${d.getDate()}`; })()
        : '';
      const avg      = calcAvgCycleDays(s.category, s.place);
      const cycleStr = avg ? `🔄 平均 ${Math.round(avg)} 日/本` : '';
      return `
      <div class="stock-item" onclick="toggleDetail(this)">
        <div class="stock-main">
          <div class="stock-dot ${dotClass}"></div>
          <div class="stock-category">${s.category}</div>
          <div class="stock-count">
            あと ${countNum}<span> ${unit}</span>
            <div class="stock-date">${dateStr}</div>
          </div>
          <div class="stock-chevron">▼</div>
        </div>
        <div class="stock-detail">
          ${names}
          ${cycleStr ? `<div style="margin-top:4px;color:#aaa">${cycleStr}</div>` : ''}
        </div>
      </div>`;
    }).join('');

    return `
    <div class="place-group open" id="place-${p.key}">
      <div class="place-header" onclick="togglePlace('place-${p.key}')">
        <div class="place-title">${p.icon} ${p.key}</div>
        <div class="place-badges">${dots}</div>
        <div class="place-chevron">▼</div>
      </div>
      <div class="place-items">${itemsHtml}</div>
    </div>`;
  }).join('');
}

function togglePlace(id) {
  document.getElementById(id).classList.toggle('open');
}

function toggleDetail(el) { el.classList.toggle('open'); }

function switchTab(tab) {
  document.getElementById('tab-stock').classList.toggle('active', tab === 'stock');
  document.getElementById('tab-shopping').classList.toggle('active', tab === 'shopping');
  document.getElementById('view-stock').classList.toggle('active', tab === 'stock');
  document.getElementById('view-shopping').classList.toggle('active', tab === 'shopping');
  if (tab === 'shopping') renderShoppingList();
}

function renderShoppingList() {
  const list          = document.getElementById('shopping-list');
  const stock         = calcStock();
  const inactiveItems = getInactiveItems();

  const needItems  = stock.filter(s => s.count <= 1);
  const cycleItems = inactiveItems.filter(s =>
    !needItems.some(n => n.place === s.place && n.category === s.category)
  );

  if (needItems.length === 0 && cycleItems.length === 0) {
    list.innerHTML = `<div class="shopping-empty">✅ 補充が必要なものは<br>ありません</div>`;
    return;
  }

  let html = '';

  if (needItems.length > 0) {
    const usedPlaces = PLACES.filter(p => needItems.some(s => s.place === p.key));
    html += usedPlaces.map(p => {
      const items = needItems.filter(s => s.place === p.key);
      const rows = items.map(s => {
        const isEmpty   = s.count <= 0;
        const color     = isEmpty ? '#e74c3c' : '#f39c12';
        const label     = isEmpty ? '❌ 切れた' : '⚠️ 残り1個';
        const isInactive = inactiveItems.some(x => x.place === s.place && x.category === s.category);
        const cycleBadge = isInactive
          ? `<div style="font-size:11px;color:#aaa;margin-top:3px">🔔 サイクル外れ</div>` : '';
        return `<div style="background:#fff;border-radius:10px;padding:14px 16px;display:flex;align-items:center;gap:8px;border-left:5px solid ${color};margin-bottom:6px">
          <div style="flex:1;font-size:18px;font-weight:700">${s.category}${cycleBadge}</div>
          <div style="font-size:15px;font-weight:700;color:${color};white-space:nowrap">${label}</div>
        </div>`;
      }).join('');
      return `<div style="margin-bottom:12px">
        <div style="font-size:13px;font-weight:700;color:#888;padding:2px 4px 6px;letter-spacing:.06em">${p.icon} ${p.key}</div>
        ${rows}
      </div>`;
    }).join('');
  }

  if (cycleItems.length > 0) {
    const rows = cycleItems.map(s => {
      const days = Math.round(daysSinceLastOpened(s.category, s.place));
      const avg  = Math.round(calcAvgCycleDays(s.category, s.place));
      return `<div style="background:#fff;border-radius:10px;padding:14px 16px;display:flex;align-items:center;gap:8px;border-left:5px solid #aaa;margin-bottom:6px">
        <div style="flex:1;font-size:18px;font-weight:700">${s.category}</div>
        <div style="font-size:12px;color:#888;text-align:right;white-space:nowrap">🔔 ${days}日使っていない<br><span style="font-size:11px">平均${avg}日ペース</span></div>
      </div>`;
    }).join('');
    html += `<div style="margin-bottom:12px">
      <div style="font-size:13px;font-weight:700;color:#aaa;padding:2px 4px 6px;letter-spacing:.06em">⏰ サイクルを外れているもの</div>
      ${rows}
    </div>`;
  }

  list.innerHTML = html;
}

function openHistory() {
  renderHistory();
  document.getElementById('history-overlay').classList.add('show');
}
function closeHistory() {
  document.getElementById('history-overlay').classList.remove('show');
}

function renderHistory() {
  const list = document.getElementById('history-list');
  if (events.length === 0) {
    list.innerHTML = '<p style="color:#aaa;text-align:center;padding:24px">履歴がありません</p>';
    return;
  }
  list.innerHTML = events.map(e => {
    const label      = e.eventType === 'bought' ? '買った' : '使い始めた';
    const badgeClass = e.eventType === 'bought' ? 'badge-bought' : 'badge-opened';
    const d          = new Date(e.date);
    const dateStr    = `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
    return `
    <div class="history-row" id="row-${e.id}">
      <span class="event-badge ${badgeClass}">${label}</span>
      <div class="history-text">
        <div class="history-category">${e.category}</div>
        <div class="history-product">${e.name}</div>
      </div>
      <div class="history-date">${dateStr}</div>
      <button class="delete-btn" onclick="deleteEvent(${e.id})">削除</button>
    </div>`;
  }).join('');
}

function deleteEvent(id) {
  events = events.filter(e => e.id !== id);
  saveEvents();
  renderHistory();
  renderStock();
}

function overlayClickClose(e, id) {
  if (e.target === document.getElementById(id))
    document.getElementById(id).classList.remove('show');
}

renderStock();
